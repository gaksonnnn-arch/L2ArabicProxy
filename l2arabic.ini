; ملف إعدادات تعريب اللعبة وشات Lineage II
; يمكنك تعديل هذه الخيارات في أي وقت دون الحاجة لإعادة بناء الملف
; ============================================================================

[Config]
; openAllchat إعداد قديم للتوافق؛ لا يتجاوز الحد الصارم لصندوق الشات.
; الحد الأقصى للشات 45 حرفاً، ويمكن تقليله من MaxChatLineLength.
openAllchat=false

; الخيار الثاني: ArabicWindows
; true  = تشغيل ترجمة وتصحيح نصوص ملفات الـ dat مثل sysstring وقوائم اللعبة ونوافذها
; false = إيقاف ترجمة وتعديل نوافذ اللعبة وملفات الـ dat في الذاكرة
ArabicWindows=true

; الخيار الثالث: ArabicChat
; true  = تشغيل الشات العربي وتصحيح الحروف والاتجاه أثناء الكتابة الحية
; false = إيقاف الشات العربي واستخدام الشات الافتراضي للعبة
ArabicChat=true

; الخيار الرابع: UseCustomFont
; true  = تفعيل خط Cairo المخصص لنصوص اللعبة والشات والقوائم بدلاً من الخط الافتراضي
; false = استخدام الخط الافتراضي للعبة
UseCustomFont=true

; اسم الخط المخصص المطلوب استخدامه
CustomFontName=Cairo

; ----------------------------------------------------------------------------
; الخيارات المتقدمة (Advanced)
; ----------------------------------------------------------------------------

; الحد الأقصى لعدد حروف مربع اسم المستخدم (مربع تسجيل الدخول والحساب)
; الافتراضي: 25 حرفاً ثابتاً ويتوقف الإدخال فوراً عند الوصول لهذا العدد
MaxUsernameLength=25

; الحد الأقصى لعدد الحروف في سطر الشات (لا يمكن رفعه فوق 45)
; الافتراضي: 45 حرفاً، ويصدر تنبيه صوتي عند محاولة تجاوز الحد
MaxChatLineLength=45

; تفعيل عكس الأقواس تلقائياً في السياق العربي
; الافتراضي true لعكس الأقواس لتظهر باتجاه صحيح مع النص العربي المعكوس
MirrorBrackets=true

; الحد الأقصى لعدد النصوص المحفوظة في الذاكرة المؤقتة للتشكيل
; زيادة القيمة = أداء أفضل لكن استهلاك ذاكرة أكبر
MaxReshapeCacheSize=2000

; فاصل زمني (بالميلي ثانية) بين كل تنبيه صوتي عند امتلاء السطر
; لمنع الإزعاج عند استمرار الضغط على المفاتيح وسطر الشات ممتلئ
BeepThrottleMs=400

